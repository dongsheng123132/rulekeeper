name: daily-chapter

on:
  schedule:
    # 每天 22:30 UTC = 北京时间 06:30
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write next chapter (machine-gated)
        env:
          HERMES_API_BASE: ${{ secrets.HERMES_API_BASE }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL }}
        run: bash scripts/daily-chapter.sh
